*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;background:#0d0d14;color:#ddd;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;display:flex;flex-direction:column}

.body-wrap{flex:1;display:flex;overflow:hidden}
#canvas{flex:1;background:#0f0f14;position:relative;cursor:grab}

#sidebar{width:360px;background:#14141e;border-left:1px solid #252535;padding:16px;overflow-y:auto;flex-shrink:0;font-size:13px}

.botbar{height:32px;background:#14141e;border-top:1px solid #252535;padding:0 8px;display:flex;align-items:center;gap:3px;font-size:10px;color:#888;flex-shrink:0;overflow-x:auto;flex-wrap:nowrap}
.botbar .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:2px}
/* ── 连线 ── */
.link-major{stroke:#4a4a5a;stroke-width:3px;cursor:pointer}
.link-major:hover{stroke:#f0c040!important;stroke-width:5px}
.link-minor{stroke:#252535;stroke-width:1.2px;cursor:pointer}
.link-minor:hover{stroke:#f0c040!important;stroke-width:2.5px}
.link-dimmed{opacity:.05}
.link-focused{stroke:#f0c040!important;stroke-width:3.5px!important;opacity:.9}
/* ── 节点 ── */
.node-g{cursor:pointer}
.node-g circle{stroke-width:2px;transition:r .3s,opacity .4s}
.node-g:hover circle{stroke-width:4px;filter:brightness(1.3)}
.node-g text{fill:#ccc;font-size:10px;text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:opacity .4s,font-size .3s}
.node-g.focused circle{stroke-width:4px;stroke:#f0c040}
.node-g.layer1 circle{stroke-width:3px}
.node-g.dimmed circle{opacity:.07}
.node-g.dimmed text{opacity:.1;font-size:7px}
.node-g.layer1 circle{opacity:.85}
.node-g.focused circle{opacity:1;stroke-width:5px;stroke:#f0c040;filter:drop-shadow(0 0 8px rgba(240,192,64,.6))}
.node-g .badge-text{fill:#111;font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
/* ── 面板 ── */
.genre-title{margin:0 0 2px;font-size:19px}
.genre-en{color:#777;font-size:12px;margin-bottom:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;margin-bottom:10px}
.section-title{color:#777;font-size:10px;letter-spacing:1px;margin:10px 0 4px;padding-bottom:2px;border-bottom:1px solid #222}
.tag{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;background:#1e1e2a;border:1px solid #2a2a3a;margin:1px}
.chip{display:inline-block;padding:2px 7px;border-radius:8px;font-size:10px;margin:1px;cursor:pointer;border:1px solid transparent;transition:.15s}
.chip:hover{border-color:#f0c040}
.desc-text{color:#aaa;font-size:11px;line-height:1.6}
.expand-btn{padding:4px 12px;border-radius:12px;font-size:10px;cursor:pointer;border:1px solid #555;background:transparent;color:#aaa;transition:.2s;display:inline-block;margin-top:4px}
.expand-btn:hover{border-color:#f0c040;color:#f0c040}
#ttip{position:fixed;padding:8px 12px;background:#1e1e2e;border:1px solid #3a3a4a;border-radius:8px;font-size:11px;line-height:1.6;max-width:300px;pointer-events:none;z-index:999;display:none;color:#ddd}
#focus-label{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#1e1e2e;border:1px solid #f0c040;border-radius:14px;padding:6px 16px;font-size:13px;color:#f0c040;z-index:20;pointer-events:none;display:none;font-weight:700}

#guide-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#guide-card{background:#1a1a2e;border:1px solid #3a3a5a;border-radius:14px;padding:24px 28px;max-width:480px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.6);animation:gfade .3s ease}
@keyframes gfade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
#guide-card h2{font-size:18px;margin:0 0 4px;color:#f0c040}
.guide-step{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.guide-step .gs-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:#252540}
.guide-step .gs-text{color:#ccc;font-size:11px;line-height:1.5;padding-top:2px}
.guide-step .gs-text strong{color:#f0c040}
#guide-card .guide-btn{display:block;width:100%;margin-top:12px;padding:10px;border-radius:8px;border:none;background:linear-gradient(135deg,#f0c040,#e08040);color:#111;font-size:14px;font-weight:700;cursor:pointer}
#guide-card .guide-skip{display:block;text-align:center;margin-top:6px;color:#555;font-size:10px;cursor:pointer;border:none;background:none;width:100%}
@media(max-width:860px){
  .body-wrap{flex-direction:column}#canvas{height:50vh;flex:none}#sidebar{width:100%;max-height:50vh;border-left:none;border-top:2px solid #3a3a4a}

  .topbar h1{font-size:13px}
  #search-wrap{max-width:160px}
  #search{padding:4px 8px;font-size:11px}
  #back-btn{font-size:10px!important;padding:3px 8px!important}
  /* 手机端放大底栏 */
  .botbar{height:40px;padding:0 8px;gap:4px;font-size:11px;overflow-x:auto;flex-wrap:nowrap}
  .botbar .dot{width:10px;height:10px}
  .botbar button{padding:4px 10px!important;font-size:11px!important;min-width:44px;min-height:28px}
  .legend-item{font-size:11px!important;padding:4px 8px!important;margin-right:4px!important}
  .node-g text{font-size:8px}
  #focus-label{font-size:11px;padding:4px 10px}
  #guide-card{padding:16px 18px;max-width:92%}
  #guide-card h2{font-size:16px}
}
@media(max-width:480px){
  #canvas{height:45vh}#sidebar{max-height:55vh}
  .topbar h1{font-size:11px}
  #search-wrap{max-width:120px}
  .botbar{height:44px;font-size:12px}
  .botbar button{font-size:12px!important;padding:5px 12px!important}
  .legend-item{font-size:12px!important;margin-right:2px!important}
  .node-g text{font-size:7px}
}

#canvas{touch-action:none}
#sidebar .drawer-close{display:none}
@media(max-width:860px){

    transform:translateY(105%);transition:transform .28s ease;z-index:45;
    box-shadow:0 -10px 40px rgba(0,0,0,.65);padding:0 16px 18px;flex-shrink:0}

  #sidebar .drawer-close{display:flex;position:sticky;top:-18px;height:36px;align-items:flex-end;
    justify-content:flex-end;padding:0 6px 6px 0;margin:0 -16px 4px;background:#14141e;
    border-radius:14px 14px 0 0;color:#999;font-size:16px;cursor:ns-resize;border-bottom:1px solid #1e1e2a;touch-action:none}

.pat-cell{transition:fill .06s,transform .06s}

.pat-btn{margin-top:4px;padding:3px 12px;border:1px solid #3a3a4a;border-radius:6px;background:#1c1c26;color:#e8e8f0;font-size:11px;cursor:pointer}

.pat-btn{padding:3px 10px}

function getRelated(focalId){

  // Layer 1: parent if focused is a child

  links.forEach(function(l){

  W=canvas.clientWidth;H=canvas.clientHeight;if(W===0||H===0){W=1200;H=800;}
  statusEl.textContent='⏳ 初始化... '+W+'x'+H;
  svg=d3.select('#canvas').append('svg').attr('width',W).attr('height',H);
  svg.append('defs').append('marker').attr('id','arrow').attr('viewBox','0 0 10 10').attr('refX',10).attr('refY',5)
    .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto-start-reverse')
    .append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','#555');
  bgRect=svg.append('rect').attr('width',W).attr('height',H).attr('fill','#0f0f14');
  g=svg.append('g');
  zoomBeh=d3.zoom().scaleExtent([0.08,6]).on('zoom',function(ev){g.attr('transform',ev.transform);});
  svg.call(zoomBeh);svg.on('dblclick.zoom',null);
  getVN().forEach(function(n,i){n.x=W/2+(Math.random()-0.5)*300;n.y=H/2+(Math.random()-0.5)*250;});
  var catOrder=['Classical','Roots','Blues','Jazz','R&B','Rock','HipHop','Electronic','World'];
  catAng={};catR=Math.min(W,H)*0.38*(isPortrait()?0.85:1);
  catOrder.forEach(function(c,i){catAng[c]=-Math.PI/2+i*2*Math.PI/catOrder.length;});
  sim=d3.forceSimulation(getVN())
    .force('link',d3.forceLink(getVL()).id(function(d){return d.i;}).distance(function(l){return 62+Math.min(45,((linkCount[l.source.i]||0)+(linkCount[l.target.i]||0))*1.3);}))
    .force('charge',d3.forceManyBody().strength(isPortrait()?-64:-92))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collision',d3.forceCollide(function(d){return nodeR(d)+2;}))
    .force('cx',d3.forceX(function(d){return catTX(d.c);}).strength(0.05))
    .force('y',d3.forceY(function(d){return catTY(d.c);}).strength(0.05));
  sim.on('end',function(){if(simFitted)return;simFitted=true;fitGraph();});
  // V7.1: bind background-click-to-unfocus here (svg is created), not at script tail
  svg.on('click',function(){if(!isPortrait())unfocus();});
  render();
}

function isPortrait(){return window.innerWidth<860&&window.innerHeight>window.innerWidth;}
function nodeR(d){var lc=linkCount[d.i]||0;var base=7+lc*1.5;var r=Math.max(6,Math.min(32,base));if(isPortrait())r*=0.72;return r;}

// ── V7: Link classification ──
function isMajorLink(l){
  // Major links: both source AND target are top-level (no g) OR one is top-level and other is direct child
  var sTop=!l.source.g, tTop=!l.target.g;
  return sTop&&tTop;
}

function render(){
  var vnodes=getVN(),vlinks=getVL();
  vnodes.forEach(function(n){if(n.x===undefined)n.x=W/2+Math.random()*200-100;if(n.y===undefined)n.y=H/2+Math.random()*200-100;});

  // V7.1: release all pins, then re-pin the focused node so the view stays centered
  vnodes.forEach(function(n){n.fx=null;n.fy=null;});
  if(focusedNode){var _fn=nodeMap[focusedNode];if(_fn){_fn.fx=_fn.x||W/2;_fn.fy=_fn.y||H/2;}}

  sim.nodes(vnodes);sim.force('link').links(vlinks);sim.alpha(0.4).restart();

  // Links
  var lg=g.selectAll('.link-g').data([0]);lg.exit().remove();
  var lgE=lg.enter().append('g').attr('class','link-g');
  var lsel=(lgE.size()?lgE:lg).selectAll('line').data(vlinks,function(d){return d.source.i+'-'+d.target.i;});
  lsel.exit().remove();
  lsel.enter().append('line').attr('class',function(d){return isMajorLink(d)?'link-major':'link-minor';})
    .attr('marker-end','url(#arrow)')
    .on('mouseenter',function(ev,d){
      var txt=(d.x||d.source.n+' → '+d.target.n).replace(/\*\*/g,'').replace(/\n/g,'<br>');
      ttip.style.display='block';ttip.style.left=(ev.clientX+14)+'px';ttip.style.top=(ev.clientY-14)+'px';
      ttip.innerHTML='<strong style="color:#f0c040">'+d.source.n+' → '+d.target.n+'</strong> <span style="color:#888;font-size:10px">'+d.p+'</span><br><span style="color:#aaa;font-size:10px">'+txt+'</span>';
    })
    .on('mousemove',function(ev){ttip.style.left=(ev.clientX+14)+'px';ttip.style.top=(ev.clientY-14)+'px';})
    .on('mouseleave',function(){ttip.style.display='none';})
    .on('click',function(ev,d){
      ev.stopPropagation();
      var txt=(d.x||d.source.n+' → '+d.target.n).replace(/\*\*/g,'').replace(/\n/g,'<br>');
      ttip.style.display='block';ttip.style.left=(ev.clientX+14)+'px';ttip.style.top=(ev.clientY-14)+'px';
      ttip.innerHTML='<strong style="color:#f0c040">'+d.source.n+' → '+d.target.n+'</strong> <span style="color:#888;font-size:10px">'+d.p+'</span><br><span style="color:#aaa;font-size:10px">'+txt+'</span>';
      if(tipTimer)clearTimeout(tipTimer);
      tipTimer=setTimeout(function(){ttip.style.display='none';},2800);
    });
  // V7: link visibility in focus mode
  if(focusedNode){
    var rel=getRelated(focusedNode);
    lsel.merge(lsel).classed('link-dimmed',function(d){return !rel.has(d.source.i)||!rel.has(d.target.i);});
    lsel.merge(lsel).classed('link-focused',function(d){return d.source.i===focusedNode||d.target.i===focusedNode;});
  }else if(!activeFilter){
    lsel.merge(lsel).classed('link-dimmed',function(d){return !isMajorLink(d);});
    lsel.merge(lsel).classed('link-focused',false);
  }
  linkEls=g.selectAll('.link-g line');

  // Nodes
  var ng=g.selectAll('.node-g-wrap').data([0]);ng.exit().remove();
  var ngE=ng.enter().append('g').attr('class','node-g-wrap');
  var nsel=(ngE.size()?ngE:ng).selectAll('g').data(vnodes,function(d){return d.i;});
  nsel.exit().remove();
  var nent=nsel.enter().append('g').attr('class','node-g')
    .call(d3.drag().on('start',function(ev,d){if(!ev.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',function(ev,d){d.fx=ev.x;d.fy=ev.y;}).on('end',function(ev,d){if(!ev.active)sim.alphaTarget(0);}));

  nent.append('circle').attr('r',function(d){return nodeR(d);})
    .attr('fill',function(d){return catCol[d.c]||'#666';})
    .attr('stroke',function(d){return d3.color(catCol[d.c]||'#666').brighter(0.6);});
  nent.each(function(d){if(getChildren(d.i).length>0)d3.select(this).select('circle').attr('stroke-dasharray','3,2');});
  nent.append('text').attr('class','node-label').text(function(d){return d.n;})
    .attr('dy',function(d){return nodeR(d)+12;})
    .style('fill','#ccc').style('font-size','10px').style('text-anchor','middle').style('dominant-baseline','central').style('pointer-events','none');
  nent.append('text').attr('class','badge-text');

  var alln=nent.merge(nsel);
  alln.each(function(d){
    var kids=getChildren(d.i);
    var badge=d3.select(this).select('.badge-text');
    if(kids.length>0&&!expanded[d.i]){var r=nodeR(d);var hidden=kids.filter(function(k){return !visibleIds[k.i];}).length;if(hidden>0)badge.text('+'+hidden).attr('dy',-r*0.1).attr('font-size',Math.max(8,r*0.85));else badge.text('');}
    else{badge.text('');}
  });

  // ── V7: Apply focus/dim classes ──
  if(focusedNode){
    var related=getRelated(focusedNode);
    alln.classed('focused',function(d){return d.i===focusedNode;});
    alln.classed('layer1',function(d){return d.i!==focusedNode&&related.has(d.i);});
    alln.classed('dimmed',function(d){return !related.has(d.i);});
  }else{
    alln.classed('focused',false).classed('layer1',false).classed('dimmed',false);
  }

  // v7.1: click = focus spotlight + center on node
  alln.on('click',function(ev,d){
    ev.stopPropagation();
    if(longPressFired){longPressFired=false;return;}
    if(focusedNode===d.i){unfocus();return;}
    focusOn(d);
  });
  // Right-click = expand/collapse
  alln.on('contextmenu',function(ev,d){
    ev.preventDefault();ev.stopPropagation();
    showCtxMenu(ev.clientX,ev.clientY,d);
  });
  // V7.1: long-press = expand/collapse on touch devices
  alln.on('touchstart',function(ev,d){
    if(!getChildren(d.i).length)return;
    var self=this;
    self.__lp={moved:false,fired:false};
    self.__lp.timer=setTimeout(function(){
      if(self.__lp&&!self.__lp.moved){self.__lp.fired=true;longPressFired=true;
        var t=ev.touches?ev.touches[0]:ev;showCtxMenu(t.clientX,t.clientY,d);}
    },450);
  }).on('touchmove',function(ev){
    if(this.__lp){this.__lp.moved=true;clearTimeout(this.__lp.timer);}
  }).on('touchend',function(ev){
    if(this.__lp){clearTimeout(this.__lp.timer);delete this.__lp;}
  });
  d3.select('body').on('click.ctx',function(){d3.select('#ctx-menu').remove();});
  nodeEls=g.selectAll('.node-g-wrap > g');

  sim.on('tick',function(){
    g.selectAll('.link-g line').attr('x1',function(d){return d.source.x;}).attr('y1',function(d){return d.source.y;})
      .attr('x2',function(d){return d.target.x;}).attr('y2',function(d){return d.target.y;});
    g.selectAll('.node-g-wrap > g').attr('transform',function(d){return'translate('+d.x+','+d.y+')';});
  });
}

function toggleGroup(pid){
  var kids=getChildren(pid);
  if(expanded[pid]){function hd(ns){ns.forEach(function(c){delete visibleIds[c.i];delete expanded[c.i];var gc=getChildren(c.i);if(gc.length)hd(gc);});}hd(kids);delete expanded[pid];}
  else{kids.forEach(function(c){visibleIds[c.i]=true;});expanded[pid]=true;}
  render();
}

// V7.1: reusable right-click / long-press menu
function showCtxMenu(clientX,clientY,d){
  var kids=getChildren(d.i);if(!kids.length)return;
  d3.select('#ctx-menu').remove();
  var isExp=expanded[d.i];
  var menu=d3.select('body').append('div').attr('id','ctx-menu')
    .style('position','fixed').style('left',clientX+'px').style('top',clientY+'px')
    .style('background','#1e1e2e').style('border','1px solid #4a4a5a').style('border-radius','8px')
    .style('padding','6px 0').style('z-index','9999').style('min-width','150px').style('box-shadow','0 4px 16px rgba(0,0,0,.6)');
  menu.append('div').style('padding','8px 14px').style('cursor','pointer').style('font-size','12px').style('color','#f0c040')
    .text(isExp?'▼ 收起子流派':'▶ 展开子流派').on('click',function(){menu.remove();toggleGroup(d.i);});
}

// ── V9.2 节奏播放器: 16步鼓机动画 + Web Audio 合成鼓 ──
var PAT_X0=24,PAT_G=15;
var patCtx=null,patTimer=null,patStep=0,patPlayingId=null,patMask=null,patBarEl=null,patCells=null,patBtnEls={};
// 节奏/音色共用 AudioContext 句柄; 每次点击播放都会重建为全新运行态引擎, 规避各浏览器挂起/恢复差异
var audioCtx=null;
function getAudioCtx(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return audioCtx;}
function patAudio(){return getAudioCtx();}
function patDrum(row,t){
  var ctx=patAudio();if(!ctx)return;var now=ctx.currentTime+t;
  if(row===0){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(160,now);o.frequency.exponentialRampToValueAtTime(42,now+0.14);
    g.gain.setValueAtTime(0.9,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+0.32);
  }else if(row===1){
    var buf=ctx.createBuffer(1,ctx.sampleRate*0.22,ctx.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    var n=ctx.createBufferSource();n.buffer=buf;
    var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=0.8;
    var g2=ctx.createGain();g2.gain.setValueAtTime(0.5,now);g2.gain.exponentialRampToValueAtTime(0.001,now+0.2);
    n.connect(bp);bp.connect(g2);g2.connect(ctx.destination);n.start(now);
    var o2=ctx.createOscillator(),g3=ctx.createGain();
    o2.type='triangle';o2.frequency.setValueAtTime(220,now);o2.frequency.exponentialRampToValueAtTime(140,now+0.1);
    g3.gain.setValueAtTime(0.35,now);g3.gain.exponentialRampToValueAtTime(0.001,now+0.12);
    o2.connect(g3);g3.connect(ctx.destination);o2.start(now);o2.stop(now+0.14);
  }else{
    var buf2=ctx.createBuffer(1,ctx.sampleRate*0.06,ctx.sampleRate),d2=buf2.getChannelData(0);
    for(var j=0;j<d2.length;j++)d2[j]=(Math.random()*2-1)*(1-j/d2.length);
    var n2=ctx.createBufferSource();n2.buffer=buf2;
    var hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;
    var g4=ctx.createGain();g4.gain.setValueAtTime(0.22,now);g4.gain.exponentialRampToValueAtTime(0.001,now+0.05);
    n2.connect(hp);hp.connect(g4);g4.connect(ctx.destination);n2.start(now);
  }
}
// 16步节奏条带图 (pat: "BPM|KICK16步|SNARE16步|HAT16步")
function patStripHTML(pat,pid){
  var p=pat.split('|');var rows=[['K',p[1],0],['S',p[2],1],['H',p[3],2]];
  var C=16,G=PAT_G,X0=PAT_X0,P=4,T=18;
  var w=C*G+X0+P*2,h=rows.length*T+16;
  var col=['#f0c040','#e8e8f0','#40c4ff'];
  var s='<div class="pat-wrap"><svg id="pat-svg-'+pid+'" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="background:#13131b;border:1px solid #26262f;border-radius:8px;display:block">';
  s+='<text x="4" y="11" fill="#8a8a96" font-size="10" font-family="ui-monospace,monospace">'+p[0]+' BPM</text>';
  s+='<rect id="pat-bar-'+pid+'" x="'+X0+'" y="16" width="11" height="'+rows.length*T+'" fill="#ffffff" opacity="0" rx="2"/>';
  rows.forEach(function(r){
    var y=16+r[2]*T;
    s+='<text x="6" y="'+(y+8)+'" fill="'+col[r[2]]+'" font-size="9" font-family="ui-monospace,monospace" font-weight="bold">'+r[0]+'</text>';
    for(var c=0;c<C;c++){
      var on=r[1][c]==='1';
      s+='<rect class="pat-cell" data-on="'+(on?'1':'0')+'" data-ri="'+r[2]+'" data-ci="'+c+'" x="'+(X0+c*G)+'" y="'+y+'" width="11" height="7" rx="2" fill="'+(on?col[r[2]]:'#26262f')+'"/>';
    }
  });
  s+='</svg>';
  s+='<p class="pat-legend"><span style="color:#f0c040">K 底鼓</span>：最沉的“咚咚”声 · <span style="color:#e8e8f0">S 军鼓</span>：清脆的“啪”声 · <span style="color:#40c4ff">H 踩镲</span>：细碎的“滋滋”声</p>';
  s+='<div class="pat-btns"><button id="pat-btn-'+pid+'-all" class="pat-btn" data-mode="all" data-label="▶ 全部试听">▶ 全部试听</button>';
  s+='<button id="pat-btn-'+pid+'-0" class="pat-btn" data-mode="0" data-label="▶ 底鼓">▶ 底鼓</button>';
  s+='<button id="pat-btn-'+pid+'-1" class="pat-btn" data-mode="1" data-label="▶ 军鼓">▶ 军鼓</button>';
  s+='<button id="pat-btn-'+pid+'-2" class="pat-btn" data-mode="2" data-label="▶ 踩镲">▶ 踩镲</button></div></div>';
  return s;
}
function patToggle(pid,pat,btn,mode){
  if(patPlayingId===btn.id){patStop();return;}
  toneStop();stopSong();
  if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}
  var ctx=patAudio();if(!ctx)return;
  if(ctx.state==='suspended'&&ctx.resume)ctx.resume();
  patStop();
  var p=pat.split('|'),bpm=+p[0]||120,rows=[p[1],p[2],p[3]];
  patPlayingId=btn.id;patStep=0;
  bgmHold();
  patMask=mode==='all'?[0,1,2]:[+mode];
  patBarEl=document.getElementById('pat-bar-'+pid);
  patCells=patBarEl?patBarEl.ownerSVGElement.querySelectorAll('.pat-cell'):[];
  patBtnEls[btn.id]=btn;btn.textContent='⏸ 停止';
  var stepDur=60/bpm/4,next=ctx.currentTime+0.08;
  function step(){
    var s=patStep%16;
    for(var r=0;r<3;r++){if(patMask.indexOf(r)>=0&&rows[r]&&rows[r][s]==='1')patDrum(r,next-ctx.currentTime);}
    if(patBarEl)patBarEl.setAttribute('x',PAT_X0+s*PAT_G);
    if(patCells.length){for(var k=0;k<patCells.length;k++){
      var c=patCells[k];c.setAttribute('class','pat-cell');
      if(c.getAttribute('data-ci')==String(s)&&c.getAttribute('data-on')==='1'&&patMask.indexOf(+c.getAttribute('data-ri'))>=0)c.setAttribute('class','pat-cell pat-hit');
    }}
    patStep++;next+=stepDur;
  }
  step();
  patTimer=setInterval(function(){while(next<ctx.currentTime+0.15){step();}},30);
}
function patStop(){
  bgmResume();
  if(patTimer){clearInterval(patTimer);patTimer=null;}
  for(var kk in patBtnEls){var b=patBtnEls[kk];if(b){var lab=b.getAttribute('data-label');if(lab)b.textContent=lab;}}
  if(patBarEl){patBarEl.setAttribute('opacity','0');patBarEl=null;}
  if(patCells){for(var k=0;k<patCells.length;k++)patCells[k].setAttribute('class','pat-cell');patCells=null;}
  patPlayingId=null;patMask=null;
}

// ── V9.2 音色引擎: 合成器音色小样 + 实时频谱 ──
var toneCtx=null,toneRaf=null,tonePlayingId=null,toneNoteEl=null,toneBars=[],toneNoteTimers=[],toneSrc=null;
function toneAudio(){return getAudioCtx();}
function noteFreq(n){var m=/^([A-G]#?)(\d)$/.exec(n);if(!m)return 220;var names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];var idx=names.indexOf(m[1]);if(idx<0)return 220;var oct=+m[2];return 440*Math.pow(2,(idx+12*(oct-4)-9)/12);}
function engFutureBounce(ctx,note,t,dur,vol,out){
  var now=ctx.currentTime+t,f=noteFreq(note);
  var bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=1.3;
  var g=ctx.createGain();g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+0.01);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  [-5,6].forEach(function(c){
    var o=ctx.createOscillator();o.type='square';o.frequency.setValueAtTime(f*1.55,now);o.frequency.exponentialRampToValueAtTime(f,now+0.09);o.detune.value=c;
    o.connect(bp);o.start(now);o.stop(now+dur+0.02);
  });
  bp.connect(g);g.connect(out);
  var buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.03),ctx.sampleRate),dd=buf.getChannelData(0);
  for(var i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);
  var n=ctx.createBufferSource();n.buffer=buf;
  var hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=2800;
  var ng=ctx.createGain();ng.gain.setValueAtTime(0.1,now);ng.gain.exponentialRampToValueAtTime(0.0001,now+0.03);
  n.connect(hp);hp.connect(ng);ng.connect(out);n.start(now);
}
function toneDrumK(ctx,t){var now=ctx.currentTime+t,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(150,now);o.frequency.exponentialRampToValueAtTime(45,now+0.12);g.gain.setValueAtTime(0.7,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.25);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+0.27);}
function toneDrumH(ctx,t){var now=ctx.currentTime+t,buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.05),ctx.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);var n=ctx.createBufferSource();n.buffer=buf;var hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=7000;var g=ctx.createGain();g.gain.setValueAtTime(0.18,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.045);n.connect(hp);hp.connect(g);g.connect(ctx.destination);n.start(now);}
// 通用参数化合成器: wave/layers/pitch包络/滤波/LFO/噪声
function engCommon(ctx,note,t,dur,vol,out,E){
  var now=ctx.currentTime+t,f=noteFreq(note);
  var filt=null;
  if(E.flt){filt=ctx.createBiquadFilter();filt.type=E.flt.type||'lowpass';filt.frequency.value=E.flt.freq||2000;filt.Q.value=E.flt.Q||1;}
  var g=ctx.createGain();g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+0.01);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  (E.layers||[0]).forEach(function(det){
    var o=ctx.createOscillator();o.type=E.wave||'sawtooth';o.detune.value=det;
    o.frequency.setValueAtTime(f*(E.pitchFrom||1),now);

function eng808(ctx,note,t,dur,vol,out,E){

function tonePlay(pid,engName,btn){
  if(tonePlayingId===pid){toneStop();return;}
  patStop();toneStop();
  stopSong();bgmHold();
  if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}
  var ctx=toneAudio();if(!ctx)return;
  if(ctx.state==='suspended'&&ctx.resume)ctx.resume();

  tonePlayingId=pid;btn.textContent='⏸ 停止';
  var src=ctx.createGain();src.connect(ctx.destination);toneSrc=src;
  var an=ctx.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=0.72;src.connect(an);
  toneNoteEl=document.getElementById('tone-note-'+pid);
  toneBars=[];for(var i=0;i<16;i++)toneBars.push(document.getElementById('tb-'+pid+'-'+i));
  var schedule=function(){
    if(tonePlayingId!==pid)return;
    try{
      var step=60/eng.bpm/4*(eng.stepMul||2),t0=ctx.currentTime+0.08;
      for(var k=0;k<eng.riff.length;k++){
        var nt=eng.riff[k],tt=t0+k*step;
        eng.fn(ctx,nt,tt,step*(eng.durMul||1.7),eng.vol,src,eng.E);
        if(eng.drums!==false){if(k%2===0)toneDrumK(ctx,tt);else toneDrumH(ctx,tt);}
        (function(k,nt,tt){toneNoteTimers.push(setTimeout(function(){if(tonePlayingId===pid&&toneNoteEl)toneNoteEl.textContent='♪ 当前音符: '+nt+'（'+eng.name+'）';},(tt-ctx.currentTime)*1000));})(k,nt,tt);
      }
      var endT=t0+eng.riff.length*step;
      toneNoteTimers.push(setTimeout(function(){if(tonePlayingId===pid)toneStop();},(endT-ctx.currentTime)*1000+300));
      function frame(){
        var d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);
        for(var i=0;i<16;i++){var v=d[Math.floor(i*d.length/16)]/255*24;if(toneBars[i]){toneBars[i].setAttribute('y',30-v);toneBars[i].setAttribute('height',Math.max(4,v));}}
        toneRaf=requestAnimationFrame(frame);
      }

    }catch(e){toneStop();var b2=document.getElementById('tone-btn-'+pid);if(b2)b2.textContent='⚠ 该音色合成失败';}
  };

}
function toneStop(){
  bgmResume();

  if(toneRaf){cancelAnimationFrame(toneRaf);toneRaf=null;}
  for(var i=0;i<toneNoteTimers.length;i++)clearTimeout(toneNoteTimers[i]);
  toneNoteTimers=[];
  if(tonePlayingId!==null){var b=document.getElementById('tone-btn-'+tonePlayingId);if(b)b.textContent='▶ 播放音色小样';if(toneNoteEl)toneNoteEl.textContent='🎛 点击播放音色小样（含鼓底）';}
  tonePlayingId=null;toneBars=[];toneNoteEl=null;
}

  if(kids.length)h+='<button class="expand-btn" style="background:'+col+'22;border-color:'+col+';color:'+col+';margin-left:6px" data-expand="'+d.i+'">'+(isExp?'▼ 收起':'▶ 展开 '+kids.length+' 个子流派')+'</button>';
  if(d.d)h+='<p class="desc-text" style="margin-top:6px">'+d.d+'</p>';
  h+='<p class="section-title">🎯 核心特点</p><div style="line-height:2">';
  d.h.forEach(function(ch){h+='<span class="tag">'+ch+'</span>';});
  h+='</div>';
  if(d.pat)h+='<p class="section-title">🥁 节奏特征</p>'+patStripHTML(d.pat,d.i);
  if(d.tone)h+='<p class="section-title">🎛 音色特征</p>'+toneSpectrumHTML(d.i);
  h+='<p class="section-title">⬆ 前身 / 起源</p><p class="desc-text">'+d.o+'</p>';
  if(fromL.length){h+='<div>';fromL.forEach(function(l){var sc=catCol[l.source.c]||'#666';h+='<span class="chip" style="background:'+sc+'22;color:'+sc+'" data-goto="'+l.source.i+'">← '+l.source.n+'</span>';});h+='</div>';}
  h+='<p class="section-title">⬇ 延伸</p><p class="desc-text">'+d.v+'</p>';
  if(toL.length){h+='<div>';toL.forEach(function(l){var tc=catCol[l.target.c]||'#666';h+='<span class="chip" style="background:'+tc+'22;color:'+tc+'" data-goto="'+l.target.i+'">→ '+l.target.n+'</span>';});h+='</div>';}
  if(kids.length){
    h+='<p class="section-title">📦 子流派 ('+kids.length+'个)</p><div>';
    kids.forEach(function(k){var kc=catCol[k.c]||'#666';var vis=visibleIds[k.i];h+='<span class="chip" style="background:'+kc+'22;color:'+(vis?kc:'#555')+'" data-goto="'+k.i+'">'+k.n+(vis?'':' 🔒')+'</span>';});
    h+='</div>';
  }
  if(d.a)h+='<p class="section-title">🎤 代表艺术家</p><p class="desc-text">'+d.a+'</p>';
  if(d.s&&d.s!=='—')h+='<p class="section-title">🎵 推荐试听</p><p class="desc-text">'+d.s+'</p>';
  sidebar.innerHTML=h;
  var dc=sidebar.querySelector('.drawer-close[data-close]');
  if(dc){
    dc.addEventListener('click',function(ev){ev.stopPropagation();if(ev.target.classList&&ev.target.classList.contains('dc-x')){unfocus();return;}snapDrawerToggle();});
    dc.addEventListener('touchstart',function(e){drgStart=e.touches[0].clientY;drgH=sidebar.offsetHeight;drgMoved=false;},{passive:false});
    dc.addEventListener('touchmove',function(e){if(drgStart===null)return;e.preventDefault();var dy=e.touches[0].clientY-drgStart;if(Math.abs(dy)>6)drgMoved=true;sidebar.style.maxHeight='none';sidebar.style.height=Math.max(32,Math.min(92,drgH/window.innerHeight*100-dy/window.innerHeight*100))+'vh';},{passive:false});
    dc.addEventListener('touchend',function(){if(drgStart!==null&&!drgMoved)snapDrawerToggle();drgStart=null;});
    dc.addEventListener('mousedown',function(e){drgStart=e.clientY;drgH=sidebar.offsetHeight;drgMoved=false;});
  }
  sidebar.querySelectorAll('.chip[data-goto]').forEach(function(el){el.addEventListener('click',function(){var tid=this.getAttribute('data-goto');var tn=nodeMap[tid];if(!tn)return;if(!visibleIds[tid]&&tn.g){if(!expanded[tn.g])toggleGroup(tn.g);setTimeout(function(){showDetail(tn);},350);}else{showDetail(tn);}});});
  var eb=sidebar.querySelector('.expand-btn[data-expand]');if(eb)eb.addEventListener('click',function(){toggleGroup(this.getAttribute('data-expand'));setTimeout(function(){showDetail(nodeMap[d.i]);},350);});
  var pbtns=sidebar.querySelectorAll('[id^="pat-btn-'+d.i+'-"]');
  pbtns.forEach(function(b){b.addEventListener('click',function(){patToggle(d.i,d.pat,b,b.getAttribute('data-mode'));});});
  var tbtn=sidebar.querySelector('#tone-btn-'+d.i);if(tbtn&&d.tone)tbtn.addEventListener('click',function(){tonePlay(d.i,d.tone,tbtn);});
}

// (background-click-to-unfocus is bound inside init(), where svg exists)
function showPlaceholder(){patStop();toneStop();sidebar.innerHTML='<div class="empty"><div style="font-size:32px">🎧</div><p>点击曲风进入<strong>聚焦模式</strong></p><p style="font-size:11px;color:#333">被点曲风居中 · 相关环绕 · 其他半透明</p></div>';}
// Back button: floating center overlay
document.getElementById('back-btn').addEventListener('click',function(){unfocus();});
// V7.1: center + zoom the viewport on a node (scale adapts to how many related nodes surround it)
function centerOn(d){
  var relCount=getRelated(d.i).size;
  var s=Math.max(1.4,Math.min(3.2,8.5/Math.sqrt(relCount)));
  var tr=d3.zoomIdentity.translate(W/2,H/2).scale(s).translate(-(d.fx||d.x),-(d.fy||d.y));
  svg.transition().duration(650).call(zoomBeh.transform,tr);
}
// V7.1: enter focus mode — pin the node, center the view, show the detail drawer
function focusOn(d){
  if(!d){return;}
  focusedNode=d.i;
  simFitted=true; // V9.2: user took control, stop auto-refit
  d.fx=d.x;d.fy=d.y;
  focusLabel.style.display='block';focusLabel.textContent='🎯 聚焦: '+d.n;
  document.getElementById('back-btn').style.display='inline-block';
  document.body.classList.add('mg-detail');
  render();showDetail(d);
  centerOn(d);
}
// V7.1: exit focus mode
function unfocus(){
  focusedNode=null;
  focusLabel.style.display='none';
  document.getElementById('back-btn').style.display='none';
  document.body.classList.remove('mg-detail');
  render();showPlaceholder();
}

// ── Search ──
searchInput.addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();searchDrop.innerHTML='';searchDrop.classList.remove('show');
  if(!q)return;
  var scored=nodes.map(function(n){var s=0;[n.n,n.e.toLowerCase(),n.d||'',n.h.join(''),n.a||'',n.o||'',n.v||''].forEach(function(f){if(f.toLowerCase().indexOf(q)>=0)s+=1;});return{n:n,s:s};}).filter(function(r){return r.s>0;}).sort(function(a,b){return b.s-a.s;});
  if(!scored.length)return;
  scored.slice(0,10).forEach(function(r){var m=r.n;var div=document.createElement('div');div.className='sr-item';div.innerHTML='<span class="sd" style="background:'+(catCol[m.c]||'#666')+'"></span>'+m.n+' <span style="color:#666;font-size:10px">'+m.e+'</span>';div.addEventListener('click',function(){searchDrop.classList.remove('show');searchInput.value='';focusOn(m);});searchDrop.appendChild(div);});
  searchDrop.classList.add('show');
});
document.addEventListener('click',function(e){if(!e.target.closest('#search-wrap'))searchDrop.classList.remove('show');});

// ── Legend ──
var botbar=document.getElementById('botbar'),leg='';
Object.keys(catNm).forEach(function(k){leg+='<span class="legend-item" data-cat="'+k+'" style="display:inline-flex;align-items:center;cursor:pointer;padding:1px 4px;border-radius:6px;border:1px solid transparent;user-select:none;font-size:9px"><span class="dot" style="background:'+catCol[k]+';width:6px;height:6px;border-radius:50%;display:inline-block"></span>'+catNm[k]+'</span>';});
leg+='<span style="margin-left:auto"><button id="show-all-btn" style="padding:2px 6px;border-radius:6px;border:1px solid #4a4a5a;background:transparent;color:#f0c040;cursor:pointer;font-size:9px;margin-right:3px">📋 全部显示</button><button id="reset-btn" style="padding:2px 6px;border-radius:6px;border:1px solid #444;background:transparent;color:#888;cursor:pointer;font-size:9px">🔄 收起</button></span><span id="status">⏳</span>';
botbar.innerHTML=leg;statusEl=document.getElementById('status');
document.getElementById('reset-btn').addEventListener('click',function(){expanded={};Object.keys(visibleIds).forEach(function(k){delete visibleIds[k];});nodes.forEach(function(n){if(!n.g||n.k)visibleIds[n.i]=true;});document.body.classList.remove('mg-detail');focusedNode=null;focusLabel.style.display='none';render();showPlaceholder();});
document.getElementById('show-all-btn').addEventListener('click',function(){activeFilter=null;nodes.forEach(function(n){visibleIds[n.i]=true;});document.body.classList.remove('mg-detail');focusedNode=null;focusLabel.style.display='none';render();showPlaceholder();botbar.querySelectorAll('.legend-item').forEach(function(e){e.style.border='1px solid transparent';e.style.opacity='1';});});
// Legend filter
botbar.querySelectorAll('.legend-item').forEach(function(el){el.addEventListener('click',function(){var cat=this.getAttribute('data-cat');if(activeFilter===cat){activeFilter=null;el.style.border='1px solid transparent';if(nodeEls)nodeEls.classed('dimmed',false);if(linkEls)linkEls.classed('dimmed',false);return;}activeFilter=cat;botbar.querySelectorAll('.legend-item').forEach(function(e){e.style.border='1px solid transparent';e.style.opacity=e.getAttribute('data-cat')===cat?'1':'.4';});el.style.border='1px solid '+catCol[cat];if(nodeEls)nodeEls.classed('dimmed',function(d){return d.c!==cat;});if(linkEls)linkEls.classed('dimmed',function(d){return d.source.c!==cat&&d.target.c!==cat;});});});

// ── Start ──
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){requestAnimationFrame(init);});}else{requestAnimationFrame(init);}
function fitGraph(){
  try{var gn=g.node();if(gn){var bb=gn.getBBox();if(bb.width>0){var s=Math.min(2.5,0.85/Math.max(bb.width/W,bb.height/H));svg.transition().duration(800).call(zoomBeh.transform,d3.zoomIdentity.translate(W/2-s*(bb.x+bb.width/2),H/2-s*(bb.y+bb.height/2)).scale(s));}}}catch(e){}
}
setTimeout(function(){statusEl.textContent='✅ beta1.0 音乐曲风谱系: '+nodes.length+'曲风, '+links.length+'连线 | 点击曲风开始探索';fitGraph();},1000);
window.addEventListener('resize',function(){
  W=canvas.clientWidth;H=canvas.clientHeight;if(!W||!H)return;
  updateRotateTip();
  if(svg){svg.attr('width',W).attr('height',H);bgRect.attr('width',W).attr('height',H);
    svg.selectAll('.node-label').attr('dy',function(d){return nodeR(d)+12;});
    svg.selectAll('g.node-g > circle').attr('r',function(d){return nodeR(d);});
    svg.selectAll('.badge-text').attr('dy',function(d){return -nodeR(d)*0.1;}).attr('font-size',function(d){return Math.max(8,nodeR(d)*0.85);});
  }
  if(sim){sim.force('center',d3.forceCenter(W/2,H/2));catR=Math.min(W,H)*0.38*(isPortrait()?0.85:1);sim.force('cx',d3.forceX(function(d){return catTX(d.c);}).strength(0.05));sim.force('y',d3.forceY(function(d){return catTY(d.c);}).strength(0.05));sim.force('charge',d3.forceManyBody().strength(isPortrait()?-64:-92));sim.alpha(0.3).restart();}
});

// ── BGM: 首次交互自动播放(两首C418轮播) + 右下角开关 + 曲风代表曲自动播放 ──
var bgmEl=document.getElementById('bgm'),bgmBtn=document.getElementById('bgm-toggle'),bgmStarted=false,bgmUserOff=false,bgmWasPlaying=false;
var bgmTracks=['C418 - 方块谧境.mp3','C418 - 暴风前夕.mp3'],bgmIdx=0;
var SONGS={'post-punk':'Перемотка - Красива.mp3'};
var songEl=document.getElementById('song');
function startBGM(){if(bgmStarted||!bgmEl)return;bgmStarted=true;bgmEl.src=bgmTracks[0];bgmEl.volume=0.35;bgmEl.play().catch(function(){});}
function bgmHold(){if(!bgmEl)return;bgmWasPlaying=bgmStarted&&!bgmEl.paused;if(!bgmEl.paused)bgmEl.pause();}
function bgmResume(){if(bgmWasPlaying&&!bgmUserOff&&bgmStarted&&bgmEl&&bgmEl.paused){bgmEl.play().catch(function(){});}bgmWasPlaying=false;}
function playSong(f){if(!songEl)return;if(songEl.getAttribute('src')===f&&!songEl.paused)return;bgmHold();if(songEl.getAttribute('src')!==f)songEl.src=f;songEl.volume=0.6;songEl.play().catch(function(){});}
function stopSong(){if(!songEl)return;if(!songEl.paused)songEl.pause();songEl.removeAttribute('src');songEl.load();bgmResume();}
document.addEventListener('pointerdown',startBGM,{passive:true});
if(bgmEl)bgmEl.addEventListener('ended',function(){bgmIdx=(bgmIdx+1)%bgmTracks.length;bgmEl.src=bgmTracks[bgmIdx];bgmEl.play().catch(function(){});});
if(songEl)songEl.addEventListener('ended',stopSong);
window.addEventListener('load',function(){if(songEl){songEl.preload='auto';songEl.src=SONGS['post-punk'];}});
if(bgmBtn)bgmBtn.addEventListener('click',function(){if(!bgmEl)return;if(bgmEl.paused){bgmEl.play().catch(function(){});bgmUserOff=false;bgmBtn.textContent='🎵';bgmBtn.title='暂停背景音乐';}else{bgmEl.pause();bgmUserOff=true;bgmBtn.textContent='🔇';bgmBtn.title='播放背景音乐';}});

// ── Onboarding ──
if(!localStorage.getItem('mg-beta1.0-guide')){
  var ov=document.createElement('div');ov.id='guide-overlay';
  ov.innerHTML='<div id="guide-card"><h2>🎵 beta1.0 · 音乐曲风谱系</h2><div class="guide-step"><div class="gs-icon">👆</div><div class="gs-text"><strong>点击曲风</strong> → 居中聚焦，右侧弹出详情：代表艺术家 + 🥁节奏 / 🎛音色 试听</div></div><div class="guide-step"><div class="gs-icon">🖱</div><div class="gs-text"><strong>再次点击 / 空白处</strong> → 退出聚焦，回到宏观图谱</div></div><div class="guide-step"><div class="gs-icon">🟡</div><div class="gs-text"><strong>右键 / 长按节点</strong> → 展开或收起它的子流派分支</div></div><div class="guide-step"><div class="gs-icon">🥁</div><div class="gs-text"><strong>节奏特征</strong> → 16步鼓机试听，可单独听底鼓 / 军鼓 / 踩镲</div></div><div class="guide-step"><div class="gs-icon">🎛</div><div class="gs-text"><strong>音色特征</strong> → 合成器音色小样 + 实时频谱动画（部分曲风）</div></div><div class="guide-step"><div class="gs-icon">🎨</div><div class="gs-text"><strong>底部色块</strong> → 点击只看某一类曲风，再点一次恢复全部</div></div><button class="guide-btn" id="guide-start">🚀 开始探索</button><button class="guide-skip" id="guide-skip">跳过说明</button><p style="color:#555;font-size:10px;text-align:center;margin-top:8px">曲风谱系 beta1.0 · 仅供学习交流 · by CherryCIvan</p></div>';
  document.body.appendChild(ov);
  function closeGuide(){ov.remove();localStorage.setItem('mg-beta1.0-guide','1');}
  document.getElementById('guide-start').addEventListener('click',closeGuide);
  document.getElementById('guide-skip').addEventListener('click',closeGuide);
}


})();
</script>
